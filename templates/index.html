<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Billetera - Registro de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Gray-100 */
        }
        /* Transiciones suaves para interactividad */
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Scrollbar personalizado para el historial */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white shadow-md z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Mi Billetera
            </h1>
            <div class="text-sm font-medium opacity-80" id="current-date-display">
                <!-- Se llenará con JS -->
            </div>
        </div>
    </header>

    <!-- Contenedor principal: Se adapta a una columna en móviles y múltiples columnas en desktop -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 h-full items-start">
            
            <!-- Columna Izquierda (Resumen y Formulario) -->
            <div class="lg:col-span-5 xl:col-span-4 space-y-6 flex flex-col">
                
                <!-- Panel de Balance -->
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h2 class="text-sm text-gray-500 font-semibold uppercase tracking-wider mb-2">Balance Total</h2>
                    <div class="text-3xl md:text-4xl font-bold text-gray-800 mb-6" id="balance-total">
                        $0.00
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Ingresos -->
                        <div class="bg-green-50 rounded-xl p-4 border border-green-100">
                            <div class="flex items-center gap-2 text-green-600 mb-1">
                                <i class="fa-solid fa-arrow-trend-up"></i>
                                <span class="text-xs font-semibold uppercase">Ingresos</span>
                            </div>
                            <div class="text-lg font-bold text-green-700" id="balance-ingresos">
                                $0.00
                            </div>
                        </div>
                        <!-- Egresos -->
                        <div class="bg-red-50 rounded-xl p-4 border border-red-100">
                            <div class="flex items-center gap-2 text-red-600 mb-1">
                                <i class="fa-solid fa-arrow-trend-down"></i>
                                <span class="text-xs font-semibold uppercase">Egresos</span>
                            </div>
                            <div class="text-lg font-bold text-red-700" id="balance-egresos">
                                $0.00
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario de Registro -->
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Nuevo Movimiento</h2>
                    
                    <form id="transaction-form" class="space-y-4">
                        <!-- Fila: Fecha y Hora -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="fecha">Fecha</label>
                                <input type="date" id="fecha" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="hora">Hora</label>
                                <input type="time" id="hora" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                            </div>
                        </div>

                        <!-- Fila: Tipo -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Movimiento</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer relative">
                                    <input type="radio" name="tipo" value="ingreso" class="peer sr-only" checked>
                                    <div class="text-center px-4 py-2 rounded-lg border border-gray-200 peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700 hover:bg-gray-50 transition-all font-medium text-sm">
                                        <i class="fa-solid fa-plus-circle mr-1"></i> Ingreso
                                    </div>
                                </label>
                                <label class="cursor-pointer relative">
                                    <input type="radio" name="tipo" value="egreso" class="peer sr-only">
                                    <div class="text-center px-4 py-2 rounded-lg border border-gray-200 peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700 hover:bg-gray-50 transition-all font-medium text-sm">
                                        <i class="fa-solid fa-minus-circle mr-1"></i> Egreso
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Fila: Monto -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="monto">Monto</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <span class="text-gray-500 sm:text-sm">$</span>
                                </div>
                                <input type="number" id="monto" step="0.01" min="0.01" required placeholder="0.00"
                                    class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                            </div>
                        </div>

                        <!-- Fila: Descripción -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="descripcion">Descripción</label>
                            <input type="text" id="descripcion" required placeholder="Ej. Almuerzo, Pasajes, Sueldo..."
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                        </div>

                        <!-- Mensaje de error (oculto por defecto) -->
                        <div id="form-error" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded-md">
                            Por favor completa todos los campos correctamente.
                        </div>

                        <!-- Botón de Envío -->
                        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-300 transition-all">
                            Registrar Movimiento
                        </button>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha (Historial de Movimientos) -->
            <div class="lg:col-span-7 xl:col-span-8 bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-full min-h-[500px]">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center shrink-0">
                    <h2 class="text-lg font-bold text-gray-800">Historial de Movimientos</h2>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full" id="contador-movimientos">0 registros</span>
                </div>
                
                <!-- Contenedor del listado con scroll -->
                <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                    <div id="lista-movimientos" class="space-y-3">
                        <!-- Estado vacío (Se mostrará cuando no haya registros) -->
                        <div id="estado-vacio" class="flex flex-col items-center justify-center h-48 text-gray-400">
                            <i class="fa-solid fa-receipt text-4xl mb-3 opacity-50"></i>
                            <p class="text-sm">Aún no hay movimientos registrados.</p>
                            <p class="text-xs mt-1">Usa el formulario para añadir uno.</p>
                        </div>
                        <!-- Los movimientos se insertarán aquí dinámicamente -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        let movimientos = [];
        let edicionManual = false; // Bandera para saber si el usuario está escribiendo la hora

        // --- REFERENCIAS AL DOM ---
        const form = document.getElementById('transaction-form');
        const inputFecha = document.getElementById('fecha');
        const inputHora = document.getElementById('hora');
        const inputMonto = document.getElementById('monto');
        const inputDescripcion = document.getElementById('descripcion');
        const errorMsg = document.getElementById('form-error');
        
        const balanceTotalEl = document.getElementById('balance-total');
        const balanceIngresosEl = document.getElementById('balance-ingresos');
        const balanceEgresosEl = document.getElementById('balance-egresos');
        
        const listaMovimientosEl = document.getElementById('lista-movimientos');
        const estadoVacioEl = document.getElementById('estado-vacio');
        const contadorMovimientosEl = document.getElementById('contador-movimientos');
        const currentDateDisplay = document.getElementById('current-date-display');

        // --- RELOJ EN TIEMPO REAL ---
        // Si el usuario hace clic o escribe en la fecha/hora, detenemos el reloj automático
        inputFecha.addEventListener('input', () => edicionManual = true);
        inputHora.addEventListener('input', () => edicionManual = true);

        function iniciarReloj() {
            setInterval(() => {
                if (!edicionManual) {
                    const ahora = new Date();
                    // Ajuste de zona horaria local para evitar saltos de día
                    const offset = ahora.getTimezoneOffset() * 60000;
                    const fechaLocal = new Date(ahora - offset).toISOString().split('T')[0];
                    
                    inputFecha.value = fechaLocal;
                    inputHora.value = ahora.toTimeString().split(' ')[0].substring(0,5);
                }
            }, 1000); // Se actualiza cada 1 segundo
        }

        function mostrarFechaEnCabecera() {
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fechaFormateada = new Date().toLocaleDateString('es-ES', opciones);
            currentDateDisplay.textContent = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);
        }

        // --- CONEXIÓN CON EL SERVIDOR (PYTHON/SQLITE) ---

        // 1. Cargar datos desde la base de datos
        async function cargarMovimientos() {
            try {
                const respuesta = await fetch('/api/movimientos');
                const nuevosMovimientos = await respuesta.json();
                
                // Comparamos si hay cambios para no redibujar la pantalla sin necesidad (evita parpadeos)
                if (JSON.stringify(movimientos) !== JSON.stringify(nuevosMovimientos)) {
                    movimientos = nuevosMovimientos;
                    actualizarUI();
                }
            } catch (error) {
                console.error("Error al cargar los datos:", error);
            }
        }

        // 2. Guardar nuevo dato
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fecha = inputFecha.value;
            const hora = inputHora.value;
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            const monto = parseFloat(inputMonto.value);
            const descripcion = inputDescripcion.value.trim();

            if (!fecha || !hora || isNaN(monto) || monto <= 0 || descripcion === "") {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            const nuevoMovimiento = {
                fecha: fecha,
                hora: hora,
                tipo: tipo,
                monto: monto,
                descripcion: descripcion
            };

            // Enviar a Python
            await fetch('/api/movimientos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoMovimiento)
            });
            
            // Limpiar formulario y reiniciar reloj automático
            inputMonto.value = '';
            inputDescripcion.value = '';
            inputDescripcion.focus();
            edicionManual = false; // El reloj vuelve a correr
            
            // Recargar lista
            cargarMovimientos();
        });

        // 3. Eliminar dato
        window.eliminarMovimiento = async function(id) {
            if(confirm("¿Estás seguro de eliminar este registro?")) {
                await fetch(`/api/movimientos/${id}`, { method: 'DELETE' });
                cargarMovimientos();
            }
        };

        // --- ACTUALIZACIÓN DE INTERFAZ (Tu diseño original) ---
        function actualizarUI() {
            let totalIngresos = 0;
            let totalEgresos = 0;

            movimientos.forEach(mov => {
                if (mov.tipo === 'ingreso') {
                    totalIngresos += mov.monto;
                } else {
                    totalEgresos += mov.monto;
                }
            });

            const balanceTotal = totalIngresos - totalEgresos;
            const formatoMoneda = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN', minimumFractionDigits: 2 });

            balanceIngresosEl.textContent = formatoMoneda.format(totalIngresos);
            balanceEgresosEl.textContent = formatoMoneda.format(totalEgresos);
            balanceTotalEl.textContent = formatoMoneda.format(balanceTotal);

            if (balanceTotal < 0) {
                balanceTotalEl.classList.replace('text-gray-800', 'text-red-600');
            } else {
                balanceTotalEl.classList.replace('text-red-600', 'text-gray-800');
            }

            renderizarLista(formatoMoneda);
        }

        function renderizarLista(formatoMoneda) {
            contadorMovimientosEl.textContent = `${movimientos.length} registro${movimientos.length !== 1 ? 's' : ''}`;
            
            if (movimientos.length === 0) {
                estadoVacioEl.style.display = 'flex';
                listaMovimientosEl.innerHTML = '';
                listaMovimientosEl.appendChild(estadoVacioEl);
                return;
            }

            estadoVacioEl.style.display = 'none';
            listaMovimientosEl.innerHTML = '';

            movimientos.forEach(mov => {
                const esIngreso = mov.tipo === 'ingreso';
                const [anio, mes, dia] = mov.fecha.split('-');
                const fechaCorta = `${dia}/${mes}/${anio}`;
                
                const card = document.createElement('div');
                card.className = `flex justify-between items-center p-4 rounded-xl border bg-white card-hover ${esIngreso ? 'border-green-100 border-l-4 border-l-green-500' : 'border-red-100 border-l-4 border-l-red-500'}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${esIngreso ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            <i class="fa-solid ${esIngreso ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-bold text-gray-800 truncate">${escapeHTML(mov.descripcion)}</h3>
                            <div class="text-xs text-gray-500 flex items-center gap-2 mt-1">
                                <span><i class="fa-regular fa-calendar mr-1"></i> ${fechaCorta}</span>
                                <span><i class="fa-regular fa-clock mr-1"></i> ${mov.hora}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0 pl-2">
                        <div class="text-right">
                            <span class="block font-bold ${esIngreso ? 'text-green-600' : 'text-red-600'}">
                                ${esIngreso ? '+' : '-'}${formatoMoneda.format(mov.monto)}
                            </span>
                        </div>
                        <button onclick="eliminarMovimiento('${mov.id}')" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50" title="Eliminar registro">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listaMovimientosEl.appendChild(card);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // --- INICIAR APP ---
        // --- INICIAR APP ---
        window.onload = () => {
            mostrarFechaEnCabecera();
            iniciarReloj();
            cargarMovimientos(); // Traemos los datos al abrir la página
            
            // NUEVO: Pide actualizaciones al servidor cada 3 segundos (3000 milisegundos)
            setInterval(cargarMovimientos, 3000);
        };
    </script>
</body>
</html>
